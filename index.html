<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Casino Clicker — Un juego incremental con máquina tragaperras vintage estilo cel-shading." />
    <title>Casino Clicker — Dopamina Edition 🎰</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@300;400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/slot-machine.css" />
    <link rel="stylesheet" href="css/shop.css" />
    <link rel="stylesheet" href="css/effects.css" />
  </head>
  <body class="escenario-callejon">

    <!-- ═══ AMBIENT PARTICLES (purely decorative) ═══ -->
    <div class="ambient-dust" aria-hidden="true">
      <div class="dust-mote"></div><div class="dust-mote"></div><div class="dust-mote"></div>
      <div class="dust-mote"></div><div class="dust-mote"></div><div class="dust-mote"></div>
    </div>

    <!-- ═══ VIGNETTE OVERLAY ═══ -->
    <div class="vignette-overlay" aria-hidden="true"></div>

    <!-- ═══ BARRA SUPERIOR: HUD del jugador ═══ -->
    <header class="hud-bar" id="barra-superior">
      <div class="hud-left">
        <div class="hud-level-group">
          <span class="hud-level-badge" id="display-nivel">Nv.1</span>
          <div class="hud-xp-track">
            <div class="hud-xp-fill" id="xp-barra"></div>
          </div>
        </div>
        <span class="hud-scenario" id="display-escenario">🗑️ Callejón Oscuro</span>
      </div>
      <div class="hud-center">
        <span class="hud-title">CASINO CLICKER</span>
      </div>
      <div class="hud-right">
        <div class="hud-coins-group">
          <span class="hud-coins-icon">🪙</span>
          <span class="hud-coins-value" id="display-monedas">100</span>
        </div>
        <span class="hud-mps" id="display-mps">0/s</span>
      </div>
    </header>

    <!-- ═══ LAYOUT PRINCIPAL ═══ -->
    <main class="game-layout">

      <!-- COLUMNA IZQUIERDA: La máquina -->
      <section class="col-machine">
        <div class="machine-wrapper">
          <div class="machine" id="maquina-principal">

            <!-- Decorative rust patches -->
            <div class="rust-patch rust-tl" aria-hidden="true"></div>
            <div class="rust-patch rust-tr" aria-hidden="true"></div>
            <div class="rust-patch rust-bl" aria-hidden="true"></div>
            <div class="rust-patch rust-br" aria-hidden="true"></div>

            <!-- Lateral shadow strips -->
            <div class="machine-side machine-side-l" aria-hidden="true"></div>
            <div class="machine-side machine-side-r" aria-hidden="true"></div>

            <!-- ── LCD SCREEN ── -->
            <div class="machine-top">
              <div class="lcd-meter">
                <div class="lcd-meter-fill" id="medidor-barra"></div>
                <div class="lcd-meter-ticks" aria-hidden="true"></div>
              </div>
              <div class="lcd-screen" id="lcd-pantalla">
                <div class="lcd-glare" aria-hidden="true"></div>
                <div class="lcd-scanlines" aria-hidden="true"></div>
                <div class="lcd-content">
                  <span class="lcd-coins" id="display-lcd-monedas">100</span>
                  <span class="lcd-coin-icon">🪙</span>
                </div>
                <div class="lcd-result" id="resultado-tirada"></div>
              </div>
            </div>

            <!-- ── 3 REELS ── -->
            <div class="reels-area">
              <div class="reel-frame">
                <div class="reel-window">
                  <div class="tira-simbolos" id="rodillo1"></div>
                </div>
              </div>
              <div class="reel-frame">
                <div class="reel-window">
                  <div class="tira-simbolos" id="rodillo2"></div>
                </div>
              </div>
              <div class="reel-frame">
                <div class="reel-window">
                  <div class="tira-simbolos" id="rodillo3"></div>
                </div>
              </div>
            </div>

            <!-- ── CONTROL PANEL ── -->
            <div class="control-panel">
              <div class="controls-row">
                <div class="bet-controls">
                  <button id="btn-bajar-apuesta" class="btn-physical btn-yellow" aria-label="Bajar apuesta">
                    <span class="btn-face">−</span>
                  </button>
                  <div class="bet-display">
                    <span class="bet-label">BET</span>
                    <span class="bet-value" id="display-apuesta" title="Clic para apostar manualmente">10</span>
                  </div>
                  <button id="btn-subir-apuesta" class="btn-physical btn-yellow" aria-label="Subir apuesta">
                    <span class="btn-face">+</span>
                  </button>
                </div>
                <button id="btn-girar" class="btn-physical btn-pull" aria-label="Tirar">
                  <span class="btn-face">PULL</span>
                </button>
              </div>
              <!-- Decorative cables -->
              <div class="cable cable-1" aria-hidden="true"></div>
              <div class="cable cable-2" aria-hidden="true"></div>
            </div>
          </div>
        </div>

        <!-- Stats bar -->
        <div class="stats-bar">
          <div class="stat-chip">
            <span class="stat-chip-label">TIRADAS</span>
            <span class="stat-chip-value" id="display-tiradas">0</span>
          </div>
          <div class="stat-chip">
            <span class="stat-chip-label">RACHA</span>
            <span class="stat-chip-value" id="display-racha">0</span>
          </div>
          <div class="stat-chip stat-chip-reset">
            <button id="btn-reset" class="reset-btn" title="Reiniciar partida">🔄</button>
          </div>
        </div>
      </section>

      <!-- COLUMNA DERECHA: Tienda -->
      <aside class="col-shop">
        <div class="panel-tienda" id="panel-tienda">
          <div class="tienda-header" id="tienda-header">
            <span class="tienda-titulo">🛒 MEJORAS</span>
            <span class="tienda-toggle abierta" id="tienda-toggle">▼</span>
          </div>
          <div class="tienda-items" id="tienda-items"></div>
        </div>
      </aside>

    </main>

    <!-- Mensajes flotantes -->
    <div id="mensaje-juego" class="toast-msg" aria-live="polite"></div>
    <div id="notificacion-nivel" class="level-up-overlay" aria-live="polite"></div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/economy.js"></script>
    <script src="js/slotMachine.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/effectsManager.js"></script>
    <script src="js/gameManager.js"></script>
  </body>
</html>
